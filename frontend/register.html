<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - ShopEasy</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">

            <h1>ShopEasy</h1>

        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <a href="cart.html">Cart</a>
            </li>

        </ul>

    </nav>


    <!-- Register Section -->
    <section class="login-page">

        <div class="register-container">

            <!-- Left Side -->
            <div class="login-image">

                <img src="images/register-banner.png"
                     alt="Register Banner"
                     class="login-banner">

                <h1>
                    Create Account
                </h1>

                <p>
                    Join ShopEasy and start shopping
                    with exciting offers.
                </p>

            </div>


            <!-- Right Side -->
            <div class="login-form-container">

                <h2>
                    Register
                </h2>


                <form>

                    <!-- Full Name -->
                    <div class="input-group">

                        <label>
                            Full Name
                        </label>

                        <input type="text"
                               placeholder="Enter your name"
                               required>

                    </div>


                    <!-- Email -->
                    <div class="input-group">

                        <label>
                            Email Address
                        </label>

                        <input type="email"
                               placeholder="Enter your email"
                               required>

                    </div>


                    <!-- Password -->
                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input type="password"
                               placeholder="Enter password"
                               required>

                    </div>


                    <!-- Confirm Password -->
                    <div class="input-group">

                        <label>
                            Confirm Password
                        </label>

                        <input type="password"
                               placeholder="Confirm password"
                               required>

                    </div>


                    <!-- Button -->
                    <button type="submit"
                            class="login-btn">

                        Create Account

                    </button>

                </form>


                <!-- Login Link -->
                <p class="register-text">

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

            </div>

        </div>

    </section>

</body>

</html>
