<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - ShopEasy</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Top Bar -->
    <div class="top-bar">

        <p>
            🔥 Free Shipping on Orders Above $100
        </p>

    </div>


    <!-- Navbar -->
    <nav class="navbar">

        <!-- Logo -->
        <div class="logo">

            <h1>ShopEasy</h1>

        </div>


        <!-- Navigation -->
        <ul class="nav-links">

            <li>
                <a href="index.html">
                    Home
                </a>
            </li>

            <li>
                <a href="product.html">
                    Products
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>

            <li>
                <a href="register.html">
                    Register
                </a>
            </li>

            <li>

                <a href="cart.html"
                   class="cart-icon">

                    <i class="fa-solid fa-cart-shopping"></i>

                    <span class="cart-count">
                        1
                    </span>

                </a>

            </li>

        </ul>

    </nav>


    <!-- Cart Page -->
    <section class="cart-page">

        <h2 class="section-title">
            Shopping Cart
        </h2>


        <div class="cart-container">

            <!-- Left Side -->
            <div class="cart-items">

                <!-- Cart Item -->
                <div class="cart-item">

                    <!-- Product Image -->
                    <img src="images/headphones.jpg"
                         alt="Wireless Headphones">


                    <!-- Product Details -->
                    <div class="cart-details">

                        <h3>
                            Wireless Headphones
                        </h3>

                        <p class="cart-price">
                            Rs. 3500
                        </p>


                        <!-- Quantity -->
                        <div class="quantity-box">

                            <button class="qty-btn">
                                -
                            </button>

                            <span class="qty-count">
                                1
                            </span>

                            <button class="qty-btn">
                                +
                            </button>

                        </div>

                    </div>


                    <!-- Remove Button -->
                    <button class="remove-btn">

                        <i class="fa-solid fa-trash"></i>

                    </button>

                </div>

            </div>


            <!-- Right Side -->
            <div class="cart-summary">

                <h3>
                    Order Summary
                </h3>


                <div class="summary-item">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        Rs. 3500
                    </span>

                </div>


                <div class="summary-item">

                    <span>
                        Shipping
                    </span>

                    <span>
                        Rs. 100
                    </span>

                </div>


                <div class="summary-item total">

                    <span>
                        Total
                    </span>

                    <span id="cart-total">
                        Rs. 3600
                    </span>

                </div>


                <!-- Checkout Button -->
                <a href="checkout.html"
                   class="checkout-link">

                    Proceed To Checkout

                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 ShopEasy | All Rights Reserved
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
