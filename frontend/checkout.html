<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopEasy</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <!-- Top Bar -->
    <div class="top-bar">

        <p>
            🔥 Free Shipping on Orders Above $100
        </p>

    </div>


    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">

            <h1>ShopEasy</h1>

        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="cart.html">Cart</a>
            </li>

            <li>
                <a href="product.html">Products</a>
            </li>

        </ul>

    </nav>


    <!-- Checkout Page -->
    <section class="checkout-page">

        <h2 class="section-title">
            Checkout
        </h2>


        <div class="checkout-container">

            <!-- Left Side -->
            <div class="checkout-form">

                <h3>
                    Shipping Details
                </h3>

                <form>

                    <!-- Full Name -->
                    <div class="input-group">

                        <label>
                            Full Name
                        </label>

                        <input type="text"
                               placeholder="Enter your full name"
                               required>

                    </div>


                    <!-- Email -->
                    <div class="input-group">

                        <label>
                            Email Address
                        </label>

                        <input type="email"
                               placeholder="Enter your email"
                               required>

                    </div>


                    <!-- Phone -->
                    <div class="input-group">

                        <label>
                            Phone Number
                        </label>

                        <input type="text"
                               placeholder="Enter phone number"
                               required>

                    </div>


                    <!-- Address -->
                    <div class="input-group">

                        <label>
                            Shipping Address
                        </label>

                        <textarea rows="4"
                                  placeholder="Enter your address"
                                  required></textarea>

                    </div>


                    <!-- Card -->
                    <div class="input-group">

                        <label>
                            Card Number
                        </label>

                        <input type="text"
                               placeholder="XXXX XXXX XXXX XXXX"
                               required>

                    </div>


                    <!-- Button -->
                    <button type="submit"
                            class="place-order-btn">

                        Place Order

                    </button>

                </form>

            </div>


            <!-- Right Side -->
            <div class="checkout-summary">

                <h3>
                    Order Summary
                </h3>


                <div class="summary-item">

                    <span>
                        Wireless Headphones
                    </span>

                    <span>
                        Rs. 3500
                    </span>

                </div>


                <div class="summary-item">

                    <span>
                        Shipping
                    </span>

                    <span>
                        Rs. 100
                    </span>

                </div>


                <div class="summary-item total">

                    <span>
                        Total
                    </span>

                    <span>
                        Rs. 3600
                    </span>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 ShopEasy | All Rights Reserved
            </p>

        </div>

    </footer>

    <!-- JS -->
    <script src="js/main.js"></script>

</body>

</html>
